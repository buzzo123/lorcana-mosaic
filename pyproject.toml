[project]
name = "lorcana-mosaic"
version = "0.1.0"
description = "Photomosaics made exclusively of Disney Lorcana card images (Lorcast API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pillow 11.3+ ships AVIF support, which Lorcast images need.
    "Pillow>=11.3",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.scripts]
lorcana-mosaic = "lorcana_mosaic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lorcana_mosaic"]
